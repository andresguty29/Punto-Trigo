services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: puntotrigo-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    container_name: puntotrigo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-puntotrigo_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-puntotrigo}
      MYSQL_USER: ${MYSQL_USER:-puntotrigo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-puntotrigo_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.4-alpine
    container_name: puntotrigo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
